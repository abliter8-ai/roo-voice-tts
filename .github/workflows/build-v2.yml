# IP-322 — Roo Voice v3 CI: freeze roo-engine per-OS, build/bundle the Tauri
# app, and (on tag) publish a draft release with updater artifacts + latest.json.
#
# Secrets (macOS signing/notarization + updater; workflow degrades gracefully
# without them — unsigned builds for smoke only):
#   TAURI_SIGNING_PRIVATE_KEY / _PASSWORD     updater artifact signing
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_CONTENT   notarization (ASC API key)
name: build-v2

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "screenshots/**"
  workflow_dispatch:

# tauri-action CREATES a GitHub Release on tag builds — needs contents:write
# (default GITHUB_TOKEN is read-only, hence "Resource not accessible by
# integration" on the v2.0.0 tag build 29723975782; push/artifact builds don't
# need it).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14            # arm64 / Metal
            freeze: bash app/engine/freeze/build-macos.sh
          - platform: windows-latest      # x64 / Vulkan
            freeze: powershell -ExecutionPolicy Bypass -File app/engine/freeze/build-windows.ps1
          - platform: ubuntu-22.04        # x64 / Vulkan
            freeze: bash app/engine/freeze/build-linux.sh
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Engine guard tests
        # The native qwentts server and bundled weights are checked after freeze.
        run: |
          python -m pip install --quiet numpy
          python -m unittest discover -s app/engine/tests -v

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux system deps (webkit + Vulkan build tools)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libvulkan-dev libvulkan1 xz-utils

      - name: Linux Vulkan SDK (pinned LunarG glslc)
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          version='1.4.357.0'
          archive="$RUNNER_TEMP/vulkansdk-linux-x86_64-$version.tar.xz"
          curl -fsSL --retry 2 \
            "https://sdk.lunarg.com/sdk/download/$version/linux/vulkansdk-linux-x86_64-$version.tar.xz" \
            -o "$archive"
          echo '0f09bf6a0625e346bf004be70b92907e934a4c76606b323441b2baf3a5a0e66d  '"$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/$version/x86_64"
          test -x "$sdk/bin/glslc"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Windows Vulkan SDK (pinned LunarG release)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $version = '1.4.357.0'
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-windows-X64-$version.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK installer failed: $($process.ExitCode)" }
          $sdk = "C:\VulkanSDK\$version"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "Vulkan SDK glslc missing: $sdk" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Windows MSVC x64 build environment
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw "x64 MSVC toolset not found" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          $dump = cmd.exe /d /c "call `"$vcvars`" && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed: $LASTEXITCODE" }
          foreach ($line in $dump) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$' -and $Matches[1] -in @('Path', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCToolsRedistDir', 'VCINSTALLDIR', 'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion')) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Freeze roo-engine
        env:
          ROO_FREEZE_ENV: ${{ github.workspace }}/.freeze-venv
        run: ${{ matrix.freeze }}

      - name: Verify bundled resources
        shell: bash
        run: |
          python app/engine/freeze/prepare-assets.py --check \
            --output app/engine/dist/roo-engine

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: Write ASC API key for notarization (no-op without secret)
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            echo "$APPLE_API_KEY_CONTENT" > /tmp/asc-key.p8
            chmod 600 /tmp/asc-key.p8
          fi

      - name: Presign frozen engine (macOS — notarization requires every nested Mach-O signed)
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "no cert secret — skipping presign"; exit 0; fi
          KC="$RUNNER_TEMP/presign.keychain-db"
          security create-keychain -p ci "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          bash app/engine/freeze/presign-macos.sh app/engine/dist/roo-engine \
            "$APPLE_SIGNING_IDENTITY" app/src-tauri/entitlements.plist
          # signed engine must still RUN (Team-ID/library-validation interactions)
      - name: Export updater signing key when configured
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Passing an EMPTY env var makes tauri try (and fail) to parse it —
          # CI run 29686559249. Export only when the secret exists; the key
          # file is multi-line (comment + base64), hence the heredoc form.
          if [ -n "$KEY" ]; then
            { echo "TAURI_SIGNING_PRIVATE_KEY<<__ROO_EOF__"
              echo "$KEY"
              echo "__ROO_EOF__"; } >> "$GITHUB_ENV"
            # the key is passwordless (--ci); without this the CLI prompts on a
            # non-tty and dies with "Device not configured"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"
          fi

      - name: Build app (and release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: /tmp/asc-key.p8
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Roo Voice {0}', github.ref_name) || '' }}
          releaseDraft: true
          includeUpdaterJson: true

      - name: Extract macOS shipping artifact for offline smoke
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          archive="$(find app/src-tauri/target/release/bundle -type f -name '*.app.tar.gz' | head -1)"
          test -n "$archive" || { echo 'no macOS app archive produced' >&2; exit 1; }
          dest="$RUNNER_TEMP/roo-voice-installed-macos"
          mkdir -p "$dest"
          tar -xzf "$archive" -C "$dest"
          engine="$(find "$dest" -type f -path '*/Contents/Resources/roo-engine/roo-engine' | head -1)"
          test -x "$engine" || { echo "installed macOS engine not found under $dest" >&2; exit 1; }
          manifest="$(dirname "$engine")/manifest.json"
          test -f "$manifest" || { echo "installed macOS manifest not found: $manifest" >&2; exit 1; }
          printf 'ROO_INSTALLED_ENGINE=%s\nROO_INSTALLED_MANIFEST=%s\n' "$engine" "$manifest" >> "$GITHUB_ENV"

      - name: Extract Linux shipping artifact for offline smoke
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          archive="$(find app/src-tauri/target/release/bundle -type f -name '*.deb' | head -1)"
          test -n "$archive" || { echo 'no Linux deb produced' >&2; exit 1; }
          dest="$RUNNER_TEMP/roo-voice-installed-linux"
          mkdir -p "$dest"
          dpkg-deb -x "$archive" "$dest"
          engine="$(find "$dest" -type f -path '*/roo-engine/roo-engine' | head -1)"
          test -x "$engine" || { echo "installed Linux engine not found under $dest" >&2; exit 1; }
          manifest="$(dirname "$engine")/manifest.json"
          test -f "$manifest" || { echo "installed Linux manifest not found: $manifest" >&2; exit 1; }
          printf 'ROO_INSTALLED_ENGINE=%s\nROO_INSTALLED_MANIFEST=%s\n' "$engine" "$manifest" >> "$GITHUB_ENV"

      - name: Install Windows shipping artifact for offline smoke
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'app/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'no Windows NSIS installer produced' }
          $dest = Join-Path $env:RUNNER_TEMP 'roo-voice-installed-windows'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$dest") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows installer failed: $($process.ExitCode)" }
          $engine = Get-ChildItem -Path $dest -Recurse -Filter 'roo-engine.exe' -File | Select-Object -First 1
          if (-not $engine) { throw "installed Windows engine not found under $dest" }
          $manifest = Join-Path $engine.DirectoryName 'manifest.json'
          if (-not (Test-Path $manifest)) { throw "installed Windows manifest not found: $manifest" }
          "ROO_INSTALLED_ENGINE=$($engine.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROO_INSTALLED_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Offline WAV smoke on installed macOS artifact
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          python app/engine/freeze/offline-smoke.py \
            --engine "$ROO_INSTALLED_ENGINE" \
            --manifest "$ROO_INSTALLED_MANIFEST" \
            --output "$RUNNER_TEMP/roo-voice-installed-smoke" \
            --backend CPU

      - name: Offline WAV smoke on installed Linux artifact
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          python app/engine/freeze/offline-smoke.py \
            --engine "$ROO_INSTALLED_ENGINE" \
            --manifest "$ROO_INSTALLED_MANIFEST" \
            --output "$RUNNER_TEMP/roo-voice-installed-smoke" \
            --backend CPU

      - name: Offline WAV smoke on installed Windows artifact
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          python app/engine/freeze/offline-smoke.py \
            --engine "$ROO_INSTALLED_ENGINE" \
            --manifest "$ROO_INSTALLED_MANIFEST" \
            --output "$RUNNER_TEMP/roo-voice-installed-smoke" \
            --backend CPU

      - name: Upload installed artifact smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roo-voice-${{ matrix.platform }}-installed-smoke
          path: ${{ runner.temp }}/roo-voice-installed-smoke
          if-no-files-found: warn

      - name: Notarize & staple the DMG (macOS tag builds)
        # tauri-action notarizes+staples the .app but NOT the DMG wrapper, so a
        # downloaded quarantined DMG can be Gatekeeper-blocked at mount on recent
        # macOS. Submit the DMG itself, staple it, and re-upload it to the draft
        # release in place of the un-stapled one. (Was a manual step for v2.0.0.)
        if: startsWith(matrix.platform, 'macos') && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ ! -f /tmp/asc-key.p8 ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "no ASC key/issuer — skipping DMG notarization"; exit 0
          fi
          DMG="$(find app/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)"
          if [ -z "$DMG" ]; then echo "no DMG produced — skipping"; exit 0; fi
          echo "notarizing $DMG"
          xcrun notarytool submit "$DMG" --key /tmp/asc-key.p8 \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          # replace the un-stapled DMG asset already uploaded by tauri-action
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber \
            --repo "${{ github.repository }}"

      - name: Upload bundles (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: roo-voice-${{ matrix.platform }}
          path: |
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.app.tar.gz
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.AppImage
            app/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn
