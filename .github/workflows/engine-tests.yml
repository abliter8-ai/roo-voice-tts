# Fast logic gate for the engine sidecar.
#
# Qwen adapter, bundled-asset and lifecycle tests do not load model weights.
# Actual packaged speech is checked separately by build-v2.yml.
name: engine-tests

on:
  pull_request:
  push:
    branches: ["**"]
    paths:
      - "app/engine/**"
      - ".github/workflows/engine-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - run: python -m unittest discover -s app/engine/tests -v
